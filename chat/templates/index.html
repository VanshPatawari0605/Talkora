<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* ── AUTH SCREEN ── */
        #auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }

        .auth-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            width: 380px;
            text-align: center;
        }

        .auth-box h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .auth-box p { color: #888; margin-bottom: 30px; font-size: 0.9rem; }

        .auth-tabs {
            display: flex;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .auth-tab.active {
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            color: #fff;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
        }

        .input-group input:focus {
            border-color: #00d4ff;
        }

        .pfp-preview {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin: 10px auto;
            display: none;
            border: 2px solid #00d4ff;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-primary:hover { opacity: 0.85; }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        /* ── SPLASH SCREEN ── */
        #splash-screen {
            display: none;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }

        #splash-screen h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #splash-screen p { color: #888; margin-top: 10px; }

        .splash-loader {
            margin-top: 30px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── MAIN APP ── */
        #main-app {
            display: none;
            height: 100vh;
            flex-direction: row;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            background: #111;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
        }

        .sidebar-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .my-pfp {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            border: 2px solid #00d4ff;
            cursor: pointer;
        }

        .sidebar-actions {
            padding: 12px 16px;
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-new-dm {
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            border: 1px solid rgba(0,212,255,0.3);
        }

        .btn-new-group {
            background: rgba(123, 47, 247, 0.15);
            color: #7b2ff7;
            border: 1px solid rgba(123,47,247,0.3);
        }

        .btn-sm:hover { opacity: 0.75; }

        .room-list { overflow-y: auto; flex: 1; }

        .room-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #1a1a1a;
        }

        .room-item:hover { background: #1a1a1a; }
        .room-item.active { background: #1e1e2e; }

        .room-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .room-info { flex: 1; overflow: hidden; }

        .room-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .room-last-msg {
            font-size: 0.8rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00d4ff;
            flex-shrink: 0;
        }

        /* Chat Window */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0d0d0d;
        }

        .chat-header {
            padding: 14px 20px;
            background: #111;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-info { display: flex; align-items: center; gap: 12px; }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .chat-header h3 { font-size: 1rem; font-weight: 600; }
        .chat-header span { font-size: 0.8rem; color: #555; }

        .chat-header-actions { display: flex; gap: 10px; }

        .btn-icon {
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .btn-icon:hover { background: rgba(255,255,255,0.1); }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .message-row.mine { flex-direction: row-reverse; }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #333;
            flex-shrink: 0;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .msg-bubble {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message-row.mine .msg-bubble {
            background: linear-gradient(135deg, #00d4ff22, #7b2ff722);
            border: 1px solid rgba(0,212,255,0.2);
            border-bottom-right-radius: 4px;
        }

        .message-row:not(.mine) .msg-bubble {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-bottom-left-radius: 4px;
        }

        .msg-sender {
            font-size: 0.72rem;
            color: #00d4ff;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .msg-time {
            font-size: 0.7rem;
            color: #444;
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-area {
            padding: 16px 20px;
            background: #111;
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 24px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
        }

        .chat-input:focus { border-color: #00d4ff; }

        .btn-send {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .btn-send:hover { opacity: 0.85; }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state p { color: #444; margin-top: 8px; font-size: 0.9rem; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 28px;
            width: 380px;
        }

        .modal h3 { font-size: 1.1rem; margin-bottom: 20px; }

        .modal input {
            width: 100%;
            padding: 10px 14px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 12px;
            outline: none;
        }

        .modal input:focus { border-color: #00d4ff; }

        .user-list-modal { max-height: 200px; overflow-y: auto; margin-bottom: 12px; }

        .user-check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .user-check-item:hover { background: #222; }

        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }

        .btn-cancel {
            flex: 1;
            padding: 10px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }

        .btn-confirm {
            flex: 1;
            padding: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
    <div class="auth-box">
        <h1>Talkora</h1>
        <p>Connect instantly, chat freely</p>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Login</button>
            <button class="auth-tab" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div id="login-form">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password">
            </div>
            <button class="btn-primary" onclick="handleLogin()">Login</button>
        </div>

        <!-- Register Form -->
        <div id="register-form" style="display:none">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Choose a username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Choose a password">
            </div>
            <div class="input-group">
                <label>Profile Picture</label>
                <input type="file" id="reg-pfp" accept="image/*" onchange="previewPfp(this)">
                <img id="pfp-preview" class="pfp-preview">
            </div>
            <button class="btn-primary" onclick="handleRegister()">Create Account</button>
        </div>

        <p class="error-msg" id="auth-error"></p>
    </div>
</div>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
    <h1>Talkora</h1>
    <p id="splash-msg">Welcome back!</p>
    <div class="splash-loader"></div>
</div>

<!-- MAIN APP -->
<div id="main-app">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Talkora</h2>
            <img id="my-pfp" class="my-pfp" src="" alt="me">
        </div>
        <div class="sidebar-actions">
            <button class="btn-sm btn-new-dm" onclick="showNewDMModal()">+ New Chat</button>
            <button class="btn-sm btn-new-group" onclick="showNewGroupModal()">+ New Group</button>
        </div>
        <div class="room-list" id="room-list"></div>
    </div>

    <!-- Chat Window -->
    <div class="chat-window" id="chat-window">
        <div class="empty-state">
            <h2>Welcome to Talkora</h2>
            <p>Select a chat or start a new one</p>
        </div>
    </div>
</div>

<!-- NEW DM MODAL -->
<div class="modal-overlay" id="dm-modal">
    <div class="modal">
        <h3>Start a New Chat</h3>
        <input type="text" id="dm-search" placeholder="Search username..." oninput="filterUsers()">
        <div class="user-list-modal" id="dm-user-list"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('dm-modal')">Cancel</button>
        </div>
    </div>
</div>

<!-- NEW GROUP MODAL -->
<div class="modal-overlay" id="group-modal">
    <div class="modal">
        <h3>Create a Group</h3>
        <input type="text" id="group-name" placeholder="Group name">
        <input type="text" id="group-search" placeholder="Search members..." oninput="filterGroupUsers()">
        <div class="user-list-modal" id="group-user-list"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('group-modal')">Cancel</button>
            <button class="btn-confirm" onclick="handleCreateGroup()">Create</button>
        </div>
    </div>
</div>

<script>
const API = 'https://talkora-2ydi.onrender.com';
let token = localStorage.getItem('token');
let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
let currentRoom = null;
let socket = null;
let allUsers = [];
let selectedGroupMembers = [];

// ── INIT ──────────────────────────────────────────────
window.onload = () => {
    if (token && currentUser) {
        showSplash();
    }
};

// ── AUTH ──────────────────────────────────────────────
function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0) === (tab === 'login'));
    });
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('auth-error').style.display = 'none';
}

function previewPfp(input) {
    const file = input.files[0];
    if (file) {
        const preview = document.getElementById('pfp-preview');
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
    }
}

async function handleLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();
    if (!username || !password) return showError('Fill in all fields');

    const res = await fetch(`${API}/auth/login/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });

    const data = await res.json();
    if (res.ok) {
        saveAuth(data);
        showSplash();
    } else {
        showError(data.error || 'Login failed');
    }
}

async function handleRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    const pfp = document.getElementById('reg-pfp').files[0];
    if (!username || !password) return showError('Fill in all fields');

    const formData = new FormData();
    formData.append('username', username);
    formData.append('password', password);
    if (pfp) formData.append('profile_picture', pfp);

    const res = await fetch(`${API}/auth/register/`, {
        method: 'POST',
        body: formData
    });

    const data = await res.json();
    if (res.ok) {
        saveAuth(data);
        showSplash();
    } else {
        showError(JSON.stringify(data));
    }
}

function saveAuth(data) {
    token = data.access;
    currentUser = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
}

function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.display = 'block';
}

// ── SPLASH ────────────────────────────────────────────
function showSplash() {
    document.getElementById('auth-screen').style.display = 'none';
    const splash = document.getElementById('splash-screen');
    splash.style.display = 'flex';
    document.getElementById('splash-msg').textContent = `Welcome, ${currentUser.username}!`;
    setTimeout(() => {
        splash.style.display = 'none';
        showMainApp();
    }, 2000);
}

// ── MAIN APP ──────────────────────────────────────────
async function showMainApp() {
    document.getElementById('main-app').style.display = 'flex';
    const pfp = document.getElementById('my-pfp');
    if (currentUser.profile_picture) {
        pfp.src = currentUser.profile_picture;
    } else {
        pfp.style.display = 'none';
    }
    await loadRooms();
    await loadAllUsers();
}

async function loadRooms() {
    const res = await fetch(`${API}/api/rooms/`, {
        headers: { 'Authorization': `Bearer ${token}` }
    });
    const rooms = await res.json();
    renderRooms(rooms);
}

function renderRooms(rooms) {
    const list = document.getElementById('room-list');
    list.innerHTML = '';
    if (rooms.length === 0) {
        list.innerHTML = '<p style="color:#444;text-align:center;padding:20px;font-size:0.85rem;">No chats yet. Start one!</p>';
        return;
    }
    rooms.forEach(room => {
        const item = document.createElement('div');
        item.className = 'room-item';
        item.onclick = () => openRoom(room);

        const otherMember = room.room_type === 'dm'
            ? room.members.find(m => m.user.id !== currentUser.id)
            : null;

        const name = room.room_type === 'dm'
            ? (otherMember ? otherMember.user.username : 'Unknown')
            : room.name;

        const avatarLetter = name ? name[0].toUpperCase() : '?';
        const lastMsg = room.last_message
            ? `${room.last_message.sender}: ${room.last_message.content}`
            : 'No messages yet';

        item.innerHTML = `
            <div class="room-avatar">${avatarLetter}</div>
            <div class="room-info">
                <div class="room-name">${name}</div>
                <div class="room-last-msg">${lastMsg}</div>
            </div>
        `;
        list.appendChild(item);
    });
}

async function loadAllUsers() {
    const res = await fetch(`${API}/api/users/`, {
        headers: { 'Authorization': `Bearer ${token}` }
    });
    allUsers = await res.json();
}

// ── OPEN ROOM ─────────────────────────────────────────
async function openRoom(room) {
    currentRoom = room;
    document.querySelectorAll('.room-item').forEach(i => i.classList.remove('active'));
    event.currentTarget.classList.add('active');

    const otherMember = room.room_type === 'dm'
        ? room.members.find(m => m.user.id !== currentUser.id)
        : null;

    const roomName = room.room_type === 'dm'
        ? (otherMember ? otherMember.user.username : 'Unknown')
        : room.name;

    const isGroup = room.room_type === 'group';

    document.getElementById('chat-window').innerHTML = `
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-header-avatar">${roomName[0].toUpperCase()}</div>
                <div>
                    <h3>${roomName}</h3>
                    <span>${isGroup ? room.members.length + ' members' : 'Direct Message'}</span>
                </div>
            </div>
            <div class="chat-header-actions">
                ${isGroup ? `<button class="btn-icon" onclick="showAddMemberModal(${room.id})">+ Add</button>` : ''}
            </div>
        </div>
        <div class="messages-area" id="messages-area"></div>
        <div class="chat-input-area">
            <input class="chat-input" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">➤</button>
        </div>
    `;

    await loadMessages(room.id);
    connectWebSocket(room.id);
}

// ── MESSAGES ──────────────────────────────────────────
async function loadMessages(roomId) {
    const res = await fetch(`${API}/api/messages/${roomId}/`, {
        headers: { 'Authorization': `Bearer ${token}` }
    });
    const messages = await res.json();
    const area = document.getElementById('messages-area');
    area.innerHTML = '';
    messages.forEach(msg => appendMessage(msg.sender.username, msg.content, msg.timestamp, msg.sender.id === currentUser.id, msg.sender.profile_picture));
    area.scrollTop = area.scrollHeight;
}

function appendMessage(sender, content, timestamp, isMine, pfp) {
    const area = document.getElementById('messages-area');
    if (!area) return;
    const row = document.createElement('div');
    row.className = `message-row ${isMine ? 'mine' : ''}`;
    const time = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const avatarContent = pfp ? `<img class="msg-avatar" src="${API}${pfp}">` : `<div class="msg-avatar">${sender[0].toUpperCase()}</div>`;
    row.innerHTML = `
        ${avatarContent}
        <div>
            ${!isMine ? `<div class="msg-sender">${sender}</div>` : ''}
            <div class="msg-bubble">${content}</div>
            <div class="msg-time">${time}</div>
        </div>
    `;
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
}

// ── WEBSOCKET ─────────────────────────────────────────
function connectWebSocket(roomId) {
    if (socket) socket.close();
    socket = new WebSocket(`ws://127.0.0.1:8000/ws/chat/${roomId}/?token=${token}`);

    socket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        appendMessage(data.sender, data.message, data.timestamp, data.sender_id === currentUser.id, data.pfp);
    };

    socket.onclose = () => console.log('WebSocket closed');
    socket.onerror = (e) => console.error('WebSocket error', e);
}

function sendMessage() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg || !socket) return;
    socket.send(JSON.stringify({ message: msg }));
    input.value = '';
}

// ── MODALS ────────────────────────────────────────────
function showNewDMModal() {
    renderDMUserList(allUsers);
    document.getElementById('dm-modal').style.display = 'flex';
}

function renderDMUserList(users) {
    const list = document.getElementById('dm-user-list');
    list.innerHTML = '';
    users.forEach(user => {
        const item = document.createElement('div');
        item.className = 'user-check-item';
        item.innerHTML = `<div class="room-avatar" style="width:32px;height:32px;font-size:0.9rem">${user.username[0].toUpperCase()}</div> <span>${user.username}</span>`;
        item.onclick = () => startDM(user.id);
        list.appendChild(item);
    });
}

function filterUsers() {
    const q = document.getElementById('dm-search').value.toLowerCase();
    renderDMUserList(allUsers.filter(u => u.username.toLowerCase().includes(q)));
}

async function startDM(userId) {
    closeModal('dm-modal');
    const res = await fetch(`${API}/api/dm/`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
    });
    const room = await res.json();
    await loadRooms();
    openRoom(room);
}

function showNewGroupModal() {
    selectedGroupMembers = [];
    renderGroupUserList(allUsers);
    document.getElementById('group-modal').style.display = 'flex';
}

function renderGroupUserList(users) {
    const list = document.getElementById('group-user-list');
    list.innerHTML = '';
    users.forEach(user => {
        const selected = selectedGroupMembers.includes(user.id);
        const item = document.createElement('div');
        item.className = 'user-check-item';
        item.style.background = selected ? '#1e1e2e' : '';
        item.innerHTML = `
            <input type="checkbox" ${selected ? 'checked' : ''} style="accent-color:#00d4ff">
            <div class="room-avatar" style="width:32px;height:32px;font-size:0.9rem">${user.username[0].toUpperCase()}</div>
            <span>${user.username}</span>
        `;
        item.onclick = () => toggleGroupMember(user.id);
        list.appendChild(item);
    });
}

function filterGroupUsers() {
    const q = document.getElementById('group-search').value.toLowerCase();
    renderGroupUserList(allUsers.filter(u => u.username.toLowerCase().includes(q)));
}

function toggleGroupMember(userId) {
    if (selectedGroupMembers.includes(userId)) {
        selectedGroupMembers = selectedGroupMembers.filter(id => id !== userId);
    } else {
        selectedGroupMembers.push(userId);
    }
    filterGroupUsers();
}

async function handleCreateGroup() {
    const name = document.getElementById('group-name').value.trim();
    if (!name) return alert('Enter a group name');
    const res = await fetch(`${API}/api/group/`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, members: selectedGroupMembers })
    });
    const room = await res.json();
    closeModal('group-modal');
    await loadRooms();
    openRoom(room);
}

async function showAddMemberModal(roomId) {
    const username = prompt('Enter username to add:');
    if (!username) return;
    const user = allUsers.find(u => u.username === username);
    if (!user) return alert('User not found');
    await fetch(`${API}/api/group/${roomId}/add/`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: user.id })
    });
    alert(`${username} added!`);
    await loadRooms();
}

function closeModal(id) {
    document.getElementById(id).style.display = 'none';
}
</script>
